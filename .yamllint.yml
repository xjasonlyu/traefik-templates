extends: default

ignore: |
  .git/

rules:
  # Traefik configs often contain long rules (Host(...) && PathPrefix(...)), so warn instead of fail.
  line-length:
    max: 120
    level: warning
  document-start: disable
  indentation:
    spaces: 2
    indent-sequences: consistent
  truthy:
    allowed-values: ['true', 'false']
    check-keys: false
  quoted-strings:
    quote-type: single
    required: false
    allow-quoted-quotes: true
  comments:
    min-spaces-from-content: 1
  braces:
    max-spaces-inside: 1
  brackets:
    max-spaces-inside: 1
